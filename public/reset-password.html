<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ITS — Set a new password for your account">
  <title>ITS — Reset Password</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="toast-container" role="alert" aria-live="polite"></div>
  <main class="auth-page" aria-label="Reset Password">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon" aria-hidden="true">🖥️</div>
        <span class="auth-logo-text">ITS</span>
      </div>
      <h1 class="auth-title">Set New Password</h1>
      <p class="auth-subtitle">Choose a strong new password for your account.</p>

      <div id="invalid-state" class="hidden">
        <div class="alert alert-error">This reset link is invalid or has expired.</div>
        <a href="/forgot-password.html" class="btn btn-primary w-full mt-4">Request New Reset Link</a>
      </div>

      <div id="form-state">
        <div id="alert-box" class="hidden" role="alert"></div>
        <form id="reset-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="password">New Password <span class="required" aria-hidden="true">*</span></label>
            <div class="form-control-icon">
              <span class="form-icon" aria-hidden="true">🔒</span>
              <input type="password" id="password" class="form-control"
                placeholder="At least 8 chars with letters &amp; numbers"
                autocomplete="new-password" required>
              <button type="button" id="toggle-pass" class="btn btn-ghost btn-icon-sm toggle-pass-btn"
                aria-label="Toggle password visibility">👁️</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm">Confirm Password <span class="required" aria-hidden="true">*</span></label>
            <div class="form-control-icon">
              <span class="form-icon" aria-hidden="true">🔒</span>
              <input type="password" id="confirm" class="form-control"
                placeholder="Repeat your new password" autocomplete="new-password" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-full" id="submit-btn">Reset Password</button>
        </form>
      </div>

      <div id="success-state" class="hidden text-center">
        <div class="success-icon-lg" aria-hidden="true">✅</div>
        <h2 class="success-heading">Password Reset!</h2>
        <p class="text-secondary mb-6">Your password has been updated. You can now sign in.</p>
        <a href="/login.html" class="btn btn-primary">Go to Login</a>
      </div>
    </div>
  </main>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      const token = new URLSearchParams(window.location.search).get('token');
      if (!token) {
        document.getElementById('form-state').classList.add('hidden');
        document.getElementById('invalid-state').classList.remove('hidden');
        return;
      }

      // Verify token is valid
      try {
        const res = await App.api('GET', `/auth/verify-reset-token?token=${token}`);
        if (!res.valid) throw new Error();
      } catch {
        document.getElementById('form-state').classList.add('hidden');
        document.getElementById('invalid-state').classList.remove('hidden');
        return;
      }

      document.getElementById('toggle-pass').addEventListener('click', function() {
        const inp = document.getElementById('password');
        inp.type = inp.type === 'password' ? 'text' : 'password';
        this.textContent = inp.type === 'password' ? '👁️' : '🙈';
      });

      document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const confirm  = document.getElementById('confirm').value;
        const alertEl  = document.getElementById('alert-box');
        const btn      = document.getElementById('submit-btn');

        alertEl.classList.add('hidden');
        if (password !== confirm) {
          alertEl.className = 'alert alert-error';
          alertEl.textContent = 'Passwords do not match.';
          alertEl.classList.remove('hidden');
          return;
        }

        btn.classList.add('loading'); btn.disabled = true;
        try {
          await App.api('POST', '/auth/reset-password', { token, password, confirm_password: confirm });
          document.getElementById('form-state').classList.add('hidden');
          document.getElementById('success-state').classList.remove('hidden');
        } catch (err) {
          alertEl.className = 'alert alert-error';
          alertEl.textContent = err.message;
          alertEl.classList.remove('hidden');
        } finally {
          btn.classList.remove('loading'); btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
