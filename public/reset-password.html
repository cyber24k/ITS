<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IT SUPPORT — Set a new password for your account">
  <title>IT SUPPORT — Reset Password</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="toast-container" role="alert" aria-live="polite"></div>
  <main class="auth-page" aria-label="Reset Password">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="/" class="brand-wordmark">
          <span class="word-it">IT</span>
          <span class="word-support">SUPPORT</span>
        </a>
        <span class="brand-tagline">Service Desk Portal</span>
      </div>
      <h1 class="auth-title">Set New Password</h1>
      <p class="auth-subtitle">Choose a strong new password for your account.</p>

      <div id="invalid-state" class="hidden">
        <div class="alert alert-error">This reset link is invalid or has expired.</div>
        <a href="/forgot-password.html" class="btn btn-primary w-full mt-4">Request New Reset Link</a>
      </div>

      <div id="form-state">
        <div id="alert-box" class="hidden" role="alert"></div>
        <form id="reset-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="password">New Password <span class="required" aria-hidden="true">*</span></label>
            <div class="form-control-wrap">
              <input type="password" id="password" class="form-control"
                placeholder="At least 8 chars with letters &amp; numbers"
                autocomplete="new-password" required>
              <button type="button" id="toggle-pass" class="toggle-pass-btn"
                aria-label="Toggle password visibility">Show</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm">Confirm Password <span class="required" aria-hidden="true">*</span></label>
            <div class="form-control-wrap">
              <input type="password" id="confirm" class="form-control"
                placeholder="Repeat your new password" autocomplete="new-password" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-full" id="submit-btn">Reset Password</button>
        </form>
      </div>

      <div id="success-state" class="hidden text-center">
        <span class="badge badge-resolved mb-3" style="font-size: 13px; padding: 6px 14px;">Password Updated</span>
        <h2 class="success-heading">Password Reset Successfully</h2>
        <p class="text-secondary mb-6">Your password has been updated. You can now sign in with your User ID.</p>
        <a href="/login.html" class="btn btn-primary">Go to Login</a>
      </div>
    </div>
  </main>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      const token = new URLSearchParams(window.location.search).get('token');
      if (!token) {
        document.getElementById('form-state').classList.add('hidden');
        document.getElementById('invalid-state').classList.remove('hidden');
        return;
      }

      // Verify token is valid
      try {
        await App.api('GET', `/auth/verify-reset-token?token=${encodeURIComponent(token)}`);
      } catch (err) {
        document.getElementById('form-state').classList.add('hidden');
        document.getElementById('invalid-state').classList.remove('hidden');
        return;
      }

      // Toggle password
      const toggleBtn = document.getElementById('toggle-pass');
      toggleBtn.addEventListener('click', function() {
        const inp = document.getElementById('password');
        const isPass = inp.type === 'password';
        inp.type = isPass ? 'text' : 'password';
        this.textContent = isPass ? 'Hide' : 'Show';
      });

      const form    = document.getElementById('reset-form');
      const alertEl = document.getElementById('alert-box');
      const btn     = document.getElementById('submit-btn');

      function showAlert(msg) {
        alertEl.className = 'alert alert-error';
        alertEl.textContent = msg;
        alertEl.classList.remove('hidden');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertEl.classList.add('hidden');

        const password = document.getElementById('password').value;
        const confirm  = document.getElementById('confirm').value;

        if (!password || !confirm) { showAlert('Please fill in both fields.'); return; }
        if (password !== confirm)   { showAlert('Passwords do not match.'); return; }
        if (password.length < 8)    { showAlert('Password must be at least 8 characters.'); return; }

        btn.classList.add('loading'); btn.disabled = true;

        try {
          await App.api('POST', '/auth/reset-password', { token, password, confirm_password: confirm });
          document.getElementById('form-state').classList.add('hidden');
          document.getElementById('success-state').classList.remove('hidden');
        } catch (err) {
          showAlert(err.message || 'Password reset failed. The link may have expired.');
        } finally {
          btn.classList.remove('loading'); btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
