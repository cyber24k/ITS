<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IT SUPPORT — Recover your User ID by email">
  <title>IT SUPPORT — Forgot User ID</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="toast-container" role="alert" aria-live="polite"></div>
  <main class="auth-page" aria-label="Forgot User ID">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="/" class="brand-wordmark">
          <span class="word-it">IT</span>
          <span class="word-support">SUPPORT</span>
        </a>
        <span class="brand-tagline">Service Desk Portal</span>
      </div>
      <h1 class="auth-title">Forgot User ID?</h1>
      <p class="auth-subtitle">Enter your email and we'll send your User ID to you.</p>

      <div id="alert-box" class="hidden" role="alert"></div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address <span class="required" aria-hidden="true">*</span></label>
          <input type="email" id="email" class="form-control" placeholder="your@email.com" autocomplete="email" required>
        </div>
        <button type="submit" class="btn btn-primary w-full" id="submit-btn">Send My User ID</button>
      </form>
      <div class="auth-footer">
        <a href="/login.html">← Back to Login</a>
      </div>
    </div>
  </main>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const btn   = document.getElementById('submit-btn');
      const alertEl = document.getElementById('alert-box');

      btn.classList.add('loading'); btn.disabled = true;
      try {
        const res = await App.api('POST', '/auth/forgot-user-id', { email });
        alertEl.className = 'alert alert-success';
        alertEl.textContent = res.message;
        alertEl.classList.remove('hidden');
        document.getElementById('forgot-form').reset();
      } catch (err) {
        alertEl.className = 'alert alert-error';
        alertEl.textContent = err.message || 'Request failed. Please try again.';
        alertEl.classList.remove('hidden');
      } finally {
        btn.classList.remove('loading'); btn.disabled = false;
      }
    });
  </script>
</body>
</html>
