<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ITS — IT Support Ticketing System Login">
  <title>ITS — Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="toast-container" role="alert" aria-live="polite"></div>

  <main class="auth-page" id="login-page">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="auth-logo-text">ITS</span>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your IT Support account</p>

      <div id="alert-box" class="hidden" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="user-id">
            User ID <span class="required" aria-hidden="true">*</span>
          </label>
          <div class="form-control-row">
            <input type="text" id="user-id" name="user_id" class="form-control uppercase"
              placeholder="ITS-123456" autocomplete="username"
              pattern="ITS-\d{6}" required>
          </div>
          <p class="form-hint">Your unique ITS User ID (format: ITS-XXXXXX)</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            Password <span class="required" aria-hidden="true">*</span>
          </label>
          <div class="form-control-row">
            <input type="password" id="password" name="password" class="form-control"
              placeholder="Your password" autocomplete="current-password"
              required>
            <button type="button" id="toggle-pass" class="btn btn-ghost btn-sm toggle-pass-btn"
              aria-label="Show password">Show</button>
          </div>
        </div>

        <div class="flex justify-between items-center mb-4 text-sm">
          <a href="/forgot-user-id.html" class="text-muted">Forgot your User ID?</a>
          <a href="/forgot-password.html" class="text-muted">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-full btn-lg" id="login-btn">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account?
        <a href="/register.html" class="font-semibold">Create Account</a>
      </div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    (async () => {
      // Redirect if already logged in
      await App.redirectIfAuth('/dashboard.html');

      const form    = document.getElementById('login-form');
      const alertEl = document.getElementById('alert-box');
      const btn     = document.getElementById('login-btn');

      // Toggle password visibility
      document.getElementById('toggle-pass').addEventListener('click', function() {
        const inp = document.getElementById('password');
        inp.type = inp.type === 'password' ? 'text' : 'password';
        this.textContent = inp.type === 'password' ? 'Show' : 'Hide';
        this.setAttribute('aria-label', inp.type === 'password' ? 'Show password' : 'Hide password');
      });

      // Auto-uppercase user ID
      document.getElementById('user-id').addEventListener('input', function() {
        const pos = this.selectionStart;
        this.value = this.value.toUpperCase();
        this.setSelectionRange(pos, pos);
      });

      function showAlert(message, type = 'error') {
        alertEl.className = `alert alert-${type}`;
        alertEl.textContent = message;
        alertEl.classList.remove('hidden');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertEl.classList.add('hidden');

        const userId   = document.getElementById('user-id').value.trim().toUpperCase();
        const password = document.getElementById('password').value;

        if (!userId || !password) {
          showAlert('Please enter your User ID and password.');
          return;
        }

        btn.classList.add('loading');
        btn.disabled = true;

        try {
          await App.api('POST', '/auth/login', { user_id: userId, password });
          App.toast('Welcome back!', 'success');
          window.location.href = '/dashboard.html';
        } catch (err) {
          showAlert(err.message || 'Login failed. Please try again.');
        } finally {
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
