<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ITS — Reset your account password">
  <title>ITS — Forgot Password</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="toast-container" role="alert" aria-live="polite"></div>
  <main class="auth-page" aria-label="Forgot Password">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon" aria-hidden="true">🖥️</div>
        <span class="auth-logo-text">ITS</span>
      </div>
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-subtitle">Enter your User ID or email to receive a reset link.</p>

      <div id="alert-box" class="hidden" role="alert"></div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="identifier">User ID or Email <span class="required" aria-hidden="true">*</span></label>
          <div class="form-control-icon">
            <span class="form-icon" aria-hidden="true">🔍</span>
            <input type="text" id="identifier" class="form-control"
              placeholder="ITS-123456 or your@email.com" autocomplete="username" required>
          </div>
          <p class="form-hint">We'll never reveal whether an account exists for privacy.</p>
        </div>
        <button type="submit" class="btn btn-primary w-full" id="submit-btn">Send Reset Link</button>
      </form>
      <div class="auth-footer">
        <a href="/login.html">← Back to Login</a>
      </div>
    </div>
  </main>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('identifier').value.trim();
      const btn        = document.getElementById('submit-btn');
      const alertEl    = document.getElementById('alert-box');

      btn.classList.add('loading'); btn.disabled = true;
      try {
        const res = await App.api('POST', '/auth/forgot-password', { identifier });
        alertEl.className = 'alert alert-success';
        alertEl.textContent = res.message;
        alertEl.classList.remove('hidden');
      } catch (err) {
        alertEl.className = 'alert alert-error';
        alertEl.textContent = err.message || 'Request failed.';
        alertEl.classList.remove('hidden');
      } finally {
        btn.classList.remove('loading'); btn.disabled = false;
      }
    });
  </script>
</body>
</html>
